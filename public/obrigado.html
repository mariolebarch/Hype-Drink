<style>
.paybox{max-width:560px;margin:0 auto;text-align:center;padding-top:8px}
.paybox .ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;background:#a855f7;box-shadow:0 0 50px rgba(168,85,247,.6)}
.paybox .ic svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.paybox.wait .ic{background:rgba(255,255,255,.08);box-shadow:none}
.paybox.wait .ic svg{animation:spin 1s linear infinite}
.paybox.bad .ic{background:#d6365f;box-shadow:0 0 40px rgba(214,54,95,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
.paybox h1{margin-bottom:12px}
.paybox .sum{display:inline-grid;grid-template-columns:auto auto;gap:6px 18px;text-align:left;margin:18px auto 26px;padding:16px 20px;border:1px solid rgba(255,255,255,.12);border-radius:16px;font-size:15px}
.paybox .sum span{color:#a39cb8;font-family:"JetBrains Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.06em;align-self:center}
.paybox .acts{justify-content:center;flex-wrap:wrap}
.paybox .small{font-size:13px;color:#a39cb8;margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="index.html" class="logo" aria-label="Hype Drink, página inicial"><span>HYPE</span><span>DR<svg viewBox="0 0 12 24" aria-hidden="true"><path d="M8 0 1 14h5l-2 10 8-14H7z"/></svg>NK</span></a>
  <a href="index.html" class="back">← Voltar ao site</a>
</div></header>

<main>
  <div class="paybox wait" id="box" aria-live="polite">
    <div class="ic" id="ic"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg></div>
    <p class="eyebrow" id="eb">Pagamento</p>
    <h1 id="tt">Confirmando seu pagamento…</h1>
    <p id="tx">Só um instante, estamos conferindo com a InfinitePay.</p>
    <div class="sum" id="sum" hidden></div>
    <div class="acts">
      <a class="btn" id="wa" href="#" target="_blank" rel="noopener" hidden>Enviar pedido no WhatsApp</a>
      <a class="btn ghost" id="rc" href="#" target="_blank" rel="noopener" hidden>Ver comprovante</a>
      <a class="btn ghost" id="bk" href="index.html#pedido" hidden>Voltar para a sacola</a>
    </div>
    <p class="small" id="sm" hidden></p>
  </div>
</main>

<footer><a href="privacidade.html">Privacidade</a>·<a href="termos.html">Termos de Uso</a>·<a href="cookies.html">Cookies</a>·<a href="index.html">Voltar ao site</a></footer>

</html>
